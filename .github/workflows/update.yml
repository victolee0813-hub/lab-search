
name: Update and publish lab search

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'
      - 'update.py'
      - 'requirements.txt'
      - 'site/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lab-search-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Check official registry
        id: refresh
        continue-on-error: true
        run: python update.py

      - name: Save latest validated data and status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data.json site/status.json site/changes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update registry snapshot'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deploy

      - name: Report collection failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1

